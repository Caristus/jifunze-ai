services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jifunze
      POSTGRES_USER: jifunze_user
      POSTGRES_PASSWORD: jifunze_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DEBUG: "False"
      USE_POSTGRES: "True"
      POSTGRES_DB: jifunze
      POSTGRES_USER: jifunze_user
      POSTGRES_PASSWORD: jifunze_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
